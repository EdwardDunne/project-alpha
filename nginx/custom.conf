client_max_body_size 500M;

server {
    server_name  www.omnitrackers.com;
    return       301 https://omnitrackers.com$request_uri;
}

server {
    server_name  dunneweb.com www.dunneweb.com;
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
    location / {
        return 301 https://omnitrackers.com/about;
    }
}