<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#3a52c0" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Rounded flat-top hexagon -->
  <path d="
    M 545,265 Q 565,300 545,335
    L 453,495 Q 433,530 393,530
    L 207,530 Q 167,530 147,495
    L 55,335  Q 35,300  55,265
    L 147,105 Q 167,70  207,70
    L 393,70  Q 433,70  453,105
    Z
  " fill="#536de6" filter="url(#shadow)"/>

  <!-- White book silhouette (both pages combined) -->
  <path d="
    M 300,182
    C 280,163 242,128 195,112
    C 148,96  88,150  88,262
    L 88,428
    C 88,444  190,454 300,454
    C 410,454 512,444 512,428
    L 512,262
    C 512,150 452,96  405,112
    C 358,128 320,163 300,182
    Z
  " fill="white"/>

  <!-- Left page arch gap 1 (outer) -->
  <path d="M 298,204 C 278,185 244,150 200,134 C 157,118 108,172 108,265"
        fill="none" stroke="#536de6" stroke-width="19" stroke-linecap="round"/>

  <!-- Left page arch gap 2 (inner) -->
  <path d="M 298,226 C 278,207 246,172 205,157 C 166,142 128,181 128,268"
        fill="none" stroke="#536de6" stroke-width="19" stroke-linecap="round"/>

  <!-- Right page arch gap 1 (outer) -->
  <path d="M 302,204 C 322,185 356,150 400,134 C 443,118 492,172 492,265"
        fill="none" stroke="#536de6" stroke-width="19" stroke-linecap="round"/>

  <!-- Right page arch gap 2 (inner) -->
  <path d="M 302,226 C 322,207 354,172 395,157 C 434,142 472,181 472,268"
        fill="none" stroke="#536de6" stroke-width="19" stroke-linecap="round"/>

  <!-- Center spine -->
  <rect x="295" y="182" width="10" height="272" rx="3" fill="#536de6"/>

  <!-- Bottom page edge arcs (white lines on blue background below book base) -->
  <path d="M 90,432  Q 300,458 510,432" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <path d="M 98,445  Q 300,470 502,445" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <path d="M 108,457 Q 300,481 492,457" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <path d="M 120,467 Q 300,491 480,467" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <path d="M 136,476 Q 300,499 464,476" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <path d="M 158,484 Q 300,506 442,484" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>

</svg>
